site_name: DataHub.local
site_url: https://datahub-local.alvsanand.com/
site_author: Alvaro Santos Andres
site_description: >-
  DataHub.local — a full-featured data platform and homelab running on Kubernetes,
  with Trino, Airflow, Redpanda, Ollama, and more on ARM64 + AMD64 hardware.

repo_name: datahub-local/datahub-local
repo_url: https://github.com/datahub-local/datahub-local

theme:
  name: material
  logo: assets/img/logo-icon.svg
  favicon: assets/img/favicon.png
  font:
    text: Space Grotesk
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang: en
  - macros:
      include_dir: .
  - glightbox

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Architecture: architecture/overview.md
  - Cluster Setup:
      - Hardware: cluster_setup/hardware.md
      - Provisioning: cluster_setup/provisioning.md
  - Services:
      - System: services/core.md
      - CI/CD: services/cicd.md
      - Security: services/security.md
      - Data Stack: services/data.md
      - Automation: services/automation.md
      - Monitoring: services/monitoring.md
      - AI & LLMs: services/ai.md
      - Media & Utilities: services/media-and-other.md
  - Open Source: open-source/index.md
  - Roadmap: roadmap.md
  - Lessons Learned: lessons-learned.md
