<svg viewBox="0 0 200 165" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DataHub.local">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Icon centered: 100×100 at x=50 -->
  <g transform="translate(50, 4)">
    <polygon
      points="50,12 88,38 88,88 12,88 12,38"
      fill="rgba(94,138,63,0.10)"
      stroke="#7FAF5A"
      stroke-width="3"
      stroke-linecap="square"
      stroke-linejoin="miter"/>
    <rect x="26" y="48" width="48" height="9" rx="0.5" fill="#5E8A3F"/>
    <rect x="26" y="62" width="48" height="9" rx="0.5" fill="#5E8A3F"/>
    <rect x="26" y="76" width="48" height="9" rx="0.5" fill="#5E8A3F"/>
    <circle cx="33" cy="52.5" r="2.2" fill="#F4F2EC"/>
    <circle cx="33" cy="66.5" r="2.2" fill="#F4F2EC"/>
    <circle cx="33" cy="80.5" r="2.2" fill="#F4F2EC"/>
  </g>

  <!-- Separator line -->
  <line x1="60" y1="112" x2="140" y2="112" stroke="rgba(127,175,90,0.30)" stroke-width="1"/>

  <!-- Text: DataHub (bold, cream) centered -->
  <text
    x="100" y="133"
    font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="24"
    fill="#F4F2EC"
    text-anchor="middle"
    letter-spacing="-0.5">DataHub</text>

  <!-- Text: .local (moss) centered -->
  <text
    x="100" y="155"
    font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="400"
    font-size="18"
    fill="#7FAF5A"
    text-anchor="middle"
    letter-spacing="1">.local</text>
</svg>
