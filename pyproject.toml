[project]
name = "datahub-local"
version = "0.1.0"
description = "Empower your edge with a cutting-edge data platform for seamless analytics and insights at home"
authors = [{ name = "Alvaro Santos Andres", email = "alvsanand@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mkdocs-material>=9.5.3",
    "mkdocs-macros-plugin>=1.0.5",
    "mkdocs-glightbox>=0.3.6",
    "httpx>=0.27",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "c2pa-python>=0.37",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false
